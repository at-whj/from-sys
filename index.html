<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From SYS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #1e3c72, #2a5298, #6a11cb);
      padding: 24px;
    }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin-bottom: 12px; }
    p { font-size: 1.2rem; opacity: 0.9; max-width: 520px; line-height: 1.6; }
    .card {
      margin-top: 32px;
      padding: 24px 32px;
      background: rgba(255,255,255,0.12);
      border-radius: 16px;
      backdrop-filter: blur(6px);
    }
    #clock { font-size: 2rem; font-weight: 600; letter-spacing: 2px; }
    button {
      margin-top: 16px;
      padding: 10px 22px;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: #fff;
      color: #2a5298;
      font-weight: 600;
    }
    button:hover { transform: scale(1.05); }
    footer { margin-top: 40px; font-size: 0.9rem; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>Hello from SYS 👋</h1>
  <p>This simple website lives in the <strong>from-sys</strong> repository. Just open this file in your browser.</p>

  <div class="card">
    <div id="clock">--:--:--</div>
    <button id="greet">Say hi</button>
    <p id="msg"></p>
  </div>

  <footer>Made with SYS</footer>

  <script>
    function tick() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString();
    }
    tick();
    setInterval(tick, 1000);

    var greetings = ['Hi there!', 'Hello, world!', 'Greetings from SYS!', 'Welcome!'];
    document.getElementById('greet').addEventListener('click', function () {
      var pick = greetings[Math.floor(Math.random() * greetings.length)];
      document.getElementById('msg').textContent = pick;
    });
  </script>
</body>
</html>
