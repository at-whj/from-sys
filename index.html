<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From SYS</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1b1b1b;
      --muted: #6b665f;
      --rule: #d9d3c9;
      --accent: #b3402a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 18px; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.65;
      min-height: 100vh;
      padding: 72px 24px 48px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 {
      font-size: 2.6rem;
      line-height: 1.15;
      font-weight: normal;
      padding-bottom: 24px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--rule);
    }
    p { margin-bottom: 16px; }
    strong { color: var(--accent); font-weight: normal; border-bottom: 1px solid var(--accent); }
    .card {
      margin-top: 40px;
      padding: 24px 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    #clock {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 2rem;
      letter-spacing: 0.04em;
    }
    button {
      margin-top: 16px;
      padding: 8px 18px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
      border-radius: 0;
    }
    button:hover { background: var(--ink); color: var(--bg); }
    #msg { margin-top: 16px; margin-bottom: 0; color: var(--accent); min-height: 1.65em; }
    footer {
      margin-top: 48px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Hello from SYS 👋</h1>
    <p>This simple website lives in the <strong>from-sys</strong> repository. Just open this file in your browser.</p>

    <div class="card">
      <div id="clock">--:--:--</div>
      <button id="greet">Say hi</button>
      <p id="msg"></p>
    </div>

    <footer>Made with SYS</footer>
  </div>

  <script>
    function tick() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString();
    }
    tick();
    setInterval(tick, 1000);

    var greetings = ['Hi there!', 'Hello, world!', 'Greetings from SYS!', 'Welcome!'];
    document.getElementById('greet').addEventListener('click', function () {
      var pick = greetings[Math.floor(Math.random() * greetings.length)];
      document.getElementById('msg').textContent = pick;
    });
  </script>
</body>
</html>
